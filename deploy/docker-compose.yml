# RONRIKU self-hosting: Next.js (web) behind Caddy, with the Supabase CLI stack as backend.
#   cp deploy/.env.example deploy/.env   (deploy/up.sh fills it)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Supabase (`supabase start` in backend/) must be running first: web and caddy join its network.
name: ronriku

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: same-origin
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in deploy/.env}
        NEXT_PUBLIC_SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_PAYMENT_RECIPIENT: ${PAYMENT_RECIPIENT:-}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?set SITE_URL in deploy/.env}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    image: ronriku-web:latest
    restart: unless-stopped
    environment:
      # Server side talks to Kong directly on the Supabase docker network.
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://supabase_kong_ronriku:8000}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in deploy/.env}
      MINT_AUTHORITY_SECRET_KEY: ${MINT_AUTHORITY_SECRET_KEY:-}
      # Caddy overwrites X-Forwarded-For with the real client IP, so rate-limit keys can trust it.
      TRUSTED_PROXY: "1"
    volumes:
      - ${UNITY_BUILD_DIR:-../web/public/unity}:/app/web/public/unity:ro
    read_only: true
    tmpfs:
      - /tmp
      - /app/web/.next/cache:uid=1000,gid=1000
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: ${WEB_MEM_LIMIT:-768m}
    expose: ["3000"]
    networks: [default, supabase]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [web]
    environment:
      DOMAIN: ${DOMAIN:-:80}
      SUPABASE_UPSTREAM: ${SUPABASE_UPSTREAM:-supabase_kong_ronriku:8000}
    ports:
      # Local default: 127.0.0.1:8080 only. VPS: BIND_ADDR=0.0.0.0, HTTP_PORT=80, HTTPS_PORT=443.
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDR:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
      - "${BIND_ADDR:-127.0.0.1}:${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${UNITY_BUILD_DIR:-../web/public/unity}:/srv/unity:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    networks: [default, supabase]

networks:
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-supabase_network_ronriku}

volumes:
  caddy_data:
  caddy_config:
